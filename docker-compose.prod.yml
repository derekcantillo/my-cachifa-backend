services:
  postgres:
    image: postgres:16-alpine
    container_name: cachifa_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - cachifa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cachifa_network

  app:
    build:
      context: .
      target: production
    image: cachifa-backend:prod
    container_name: cachifa_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file: .env
    healthcheck:
      # /api/v1/health is the only unauthenticated endpoint, so no API key here.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cachifa_network

volumes:
  cachifa_postgres_data:

networks:
  cachifa_network:
    driver: bridge
